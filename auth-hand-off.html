<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Apex Vault | Security Gate</title>
  <!-- Third-Party Beacons (Observed by REA, Blocked by Brave Shields) -->
  <script src="https://antibot-telemetry.riskscore.mock/sensor.js" async></script>
  <script src="https://fingerprint-botguard.net/agent.js" async></script>
  <style>
    :root {
      --bg: #0f172a;
      --card-bg: #1e293b;
      --border: #334155;
      --text: #f8fafc;
      --text-muted: #94a3b8;
      --accent: #3b82f6;
      --warning: #f59e0b;
      --warning-bg: rgba(245, 158, 11, 0.1);
      --warning-border: #b45309;
      --success: #10b981;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background-color: var(--bg);
      color: var(--text);
      padding: 32px;
      display: flex;
      flex-direction: column;
      align-items: center;
    }
    .card {
      width: 100%;
      max-width: 500px;
      background: var(--card-bg);
      border: 1px solid var(--border);
      border-radius: 16px;
      padding: 32px;
      box-shadow: 0 10px 30px rgba(0,0,0,0.4);
      text-align: center;
    }
    .shield-icon { font-size: 48px; margin-bottom: 12px; }
    h1 { font-size: 20px; font-weight: 700; margin-bottom: 8px; }
    p { font-size: 13px; color: var(--text-muted); margin-bottom: 24px; }
    .captcha-box {
      background: var(--warning-bg);
      border: 1px solid var(--warning-border);
      border-radius: 10px;
      padding: 20px;
      margin-bottom: 24px;
    }
    .captcha-title {
      font-size: 14px;
      font-weight: 600;
      color: var(--warning);
      margin-bottom: 8px;
    }
    .btn-verify {
      padding: 12px 24px;
      background: var(--accent);
      color: white;
      border: none;
      border-radius: 8px;
      font-weight: 600;
      cursor: pointer;
      transition: background 0.2s;
    }
    .btn-verify:hover { background: #2563eb; }
    #protected-area {
      display: none;
      animation: fadeIn 0.4s ease;
    }
    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(10px); }
      to { opacity: 1; transform: translateY(0); }
    }
    .auth-banner {
      padding: 16px;
      background: rgba(16, 185, 129, 0.1);
      border: 1px solid #059669;
      border-radius: 8px;
      color: var(--success);
      font-weight: 600;
    }
    .agent-highlight {
      outline: 3px solid #3b82f6 !important;
      outline-offset: 2px !important;
      box-shadow: 0 0 15px rgba(59, 130, 246, 0.6) !important;
      transition: all 0.3s ease;
    }
  </style>
</head>
<body>
  <div class="card">
    <div class="shield-icon">🛡️</div>
    <h1>Security Checkpoint</h1>
    <p>Protected Corporate Banking Portal</p>

    <div class="captcha-box" id="security-box" role="alert" aria-live="assertive">
      <div class="captcha-title">Automated Interaction Handoff</div>
      <p style="margin-bottom: 16px;">The Agentic Browser detected an anti-bot challenge and paused automation. Please solve this step.</p>
      <button class="btn-verify" id="solve-captcha-btn" onclick="verifyHuman()">✓ I am a Human Operator</button>
    </div>

    <div id="protected-area">
      <div class="auth-banner">
        🔒 Security Verification Passed: Vault Access Granted
      </div>
      <p style="margin-top: 16px; color: var(--text-muted); font-size: 12px;">The autonomous agent has safely resumed operation.</p>
    </div>
  </div>

  <script>
    function verifyHuman() {
      document.getElementById('security-box').style.display = 'none';
      document.getElementById('protected-area').style.display = 'block';
      // Notify parent frame (studio) that hand-off is resolved
      window.parent.postMessage({ type: 'HANDOFF_RESOLVED' }, '*');
    }
  </script>
</body>
</html>
